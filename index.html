<script>
      document.addEventListener("DOMContentLoaded", function() {
        const startButton = document.querySelector("#start-button");
        const startOverlay = document.querySelector("#start-overlay");
        const sceneEl = document.querySelector('a-scene');

        if (startButton) {
          startButton.addEventListener('click', () => {
            startOverlay.style.display = 'none';
            
            const arSystem = sceneEl.systems["mindar-image-system"];
            if (arSystem) {
              arSystem.start();
            }

            const videos = document.querySelectorAll('video');
            videos.forEach(video => {
              video.muted = false;
              video.play().then(() => {
                video.pause();
                video.currentTime = 0;
              }).catch(e => console.log("影片初始化:", e));
            });
          });
        }

        // 精準抓取每一個 target 的編號，對應播放正確的影片
        const targets = document.querySelectorAll('[mindar-image-target]');
        targets.forEach((target) => {
          const attr = target.getAttribute('mindar-image-target');
          const match = attr ? attr.match(/targetIndex:\s*(\d+)/) : null;
          
          if (match) {
            const index = match[1];
            const videoEl = document.querySelector(`#video${index}`);
            
            if (target && videoEl) {
              target.addEventListener('targetFound', () => {
                console.log(`對準目標 ${index}，播放 video${index}`);
                videoEl.play().catch(err => console.log(`播放 video${index} 失敗:`, err));
              });
              
              target.addEventListener('targetLost', () => {
                console.log(`移開目標 ${index}，暫停`);
                videoEl.pause();
              });
            }
          }
        });
      });
    </script>
