<script>
      const startButton = document.querySelector("#start-button");
      const startOverlay = document.querySelector("#start-overlay");
      const sceneEl = document.querySelector('a-scene');

      if (startButton) {
        startButton.addEventListener('click', () => {
          startOverlay.style.display = 'none';
          
          // 啟動 AR 系統
          const arSystem = sceneEl.systems["mindar-image-system"];
          if (arSystem) {
            arSystem.start();
          }

          // 預先載入並解鎖所有影片（繞過手機限制）
          const videos = document.querySelectorAll('video');
          videos.forEach(video => {
            video.muted = false;
            video.play().then(() => {
              video.pause(); // 預載後先暫停，等待對準圖片
              video.currentTime = 0;
            }).catch(e => console.log("影片初始化:", e));
          });
        });
      }

      // 關鍵：綁定圖片識別事件，對準即播，移開即停
      const targets = document.querySelectorAll('[mindar-image-target]');
      targets.forEach((target, index) => {
        const videoEl = document.querySelector(`#video${index}`);
        if (target && videoEl) {
          target.addEventListener('targetFound', () => {
            console.log(`成功識別目標 ${index}，播放影片`);
            videoEl.play().catch(err => console.log("播放失敗:", err));
          });
          
          target.addEventListener('targetLost', () => {
            console.log(`丟失目標 ${index}，暫停影片`);
            videoEl.pause();
          });
        }
      });
    </script>
