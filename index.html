<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>希晨的 AR 成長展覽館</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      #start-overlay {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.85); color: white;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; font-family: sans-serif;
        text-align: center;
      }
      #start-button {
        padding: 15px 35px; font-size: 18px; background-color: #28a745;
        color: white; border: none; border-radius: 25px; cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-weight: bold;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>

    <div id="start-overlay">
      <h2>歡迎來到希晨的 AR 世界</h2>
      <p style="font-size: 14px; opacity: 0.8;">請點擊下方按鈕開始體驗</p>
      <button id="start-button">點擊這裡開始</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="video0" src="./video0.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video1" src="./video1.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video2" src="./video2.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video3" src="./video3.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video4" src="./video4.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#video0" width="1" height="1.777" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-video src="#video1" width="1" height="1.777" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-video src="#video2" width="1" height="1.777" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 3">
        <a-video src="#video3" width="1" height="1.777" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 4">
        <a-video src="#video4" width="1" height="1.777" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var startButton = document.querySelector("#start-button");
        var startOverlay = document.querySelector("#start-overlay");
        var sceneEl = document.querySelector('a-scene');

        if (startButton) {
          startButton.addEventListener('click', function() {
            startOverlay.style.display = 'none';
            
            var arSystem = sceneEl.systems["mindar-image-system"];
            if (arSystem) {
              arSystem.start();
            }

            for (var i = 0; i < 5; i++) {
              var video = document.querySelector("#video" + i);
              if (video) {
                video.muted = false;
                video.play().then(function() {
                  this.pause();
                  this.currentTime = 0;
                }.bind(video)).catch(function(e) {});
              }
            }
          });
        }

        var targets = document.querySelectorAll('[mindar-image-target]');
        targets.forEach(function(target, index) {
          var videoEl = document.querySelector("#video" + index);
          if (target && videoEl) {
            target.addEventListener('targetFound', function() {
              videoEl.play().catch(function(err) {});
            });
            
            target.addEventListener('targetLost', function() {
              videoEl.pause();
            });
          }
        });
      });
    </script>
  </body>
</html>
